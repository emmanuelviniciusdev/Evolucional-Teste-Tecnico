services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Escola_Dev_P@ssw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Escola_Dev_P@ssw0rd' -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    user: root
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Escola_Dev_P@ssw0rd"
      SQL_HOST: sqlserver
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./sql/init.sql:/init.sql:ro
      - ./sql/wait-and-init.sh:/wait-and-init.sh:ro
      - sql-init-marker:/initialized
    entrypoint: ["bash", "/wait-and-init.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sqlserver-data:
  sql-init-marker:
